<title id="t">Delay before the ship moves on a narrow link, one player</title><desc id="d">On a 10 KB/s link the delay was 775 ms before and 40 ms after. On a 5 KB/s link the ship waited 58 ms for the server after the changes, and the ship seen by the player moves at once on every link.</desc>
