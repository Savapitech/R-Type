<title id="t">Delay between a key press and the movement of the ship, by round trip time</title><desc id="d">Before the prediction the delay grows with the round trip time: 135 ms at 100 ms and 535 ms at 500 ms. With the prediction the ship moves in the same frame at any round trip time (0 ms at 500 ms), while the confirmation by the server (534 ms at 500 ms) keeps the delay of before.</desc>
